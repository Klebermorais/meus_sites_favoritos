
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus sites favoritos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #1f2937;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .site {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 250px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .site h2 {
            font-size: 20px;
            color: #2563eb;
        }

        .site img {
            width: 150px;
            height: 100px;
            object-fit: contain;
        }

        .site a {
            display: block;
            margin-top: 15px;
            color: #2563eb;
            text-decoration: none;
        }

        .site a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h1>Meus sites favoritos: Kleber Morais</h1>

    <div class="container">

        <div class="site">
            <h2>Google</h2>
            <a href="https://www.google.com" target="_blank">
                <img src="https://www.google.com/favicon.ico"
                     alt="Logo do Google">
            </a>
            <a href="https://www.google.com" target="_blank">
                Acessar Google
            </a>
        </div>

        <div class="site">
            <h2>YouTube</h2>
            <a href="https://www.youtube.com" target="_blank">
                <img src="https://www.youtube.com/favicon.ico"
                     alt="Logo do YouTube">
            </a>
            <a href="https://www.youtube.com" target="_blank">
                Acessar YouTube
            </a>
        </div>

        <div class="site">
            <h2>GitHub</h2>
            <a href="https://github.com" target="_blank">
                <img src="https://github.com/favicon.ico"
                     alt="Logo do GitHub">
            </a>
            <a href="https://github.com" target="_blank">
                Acessar GitHub
            </a>
        </div>

        <div class="site">
            <h2>W3Schools</h2>
            <a href="https://www.w3schools.com" target="_blank">
                <img src="https://www.w3schools.com/favicon.ico"
                     alt="Logo do W3Schools">
            </a>
            <a href="https://www.w3schools.com" target="_blank">
                Acessar W3Schools
            </a>
        </div>

        <div class="site">
            <h2>ChatGPT</h2>
            <a href="https://chatgpt.com" target="_blank">
                <img src="https://chatgpt.com/favicon.ico"
                     alt="Logo do ChatGPT">
            </a>
            <a href="https://chatgpt.com" target="_blank">
                Acessar ChatGPT
            </a>
        </div>

    </div>

</body>
</html>
